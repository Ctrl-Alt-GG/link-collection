name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.1'
          extended: true

      - name: Install Dart Sass (native)
        run: |
          curl -sL https://github.com/sass/dart-sass/releases/download/1.93.2/dart-sass-1.93.2-linux-x64.tar.gz -o dart-sass.tgz
          mkdir -p /opt/dart-sass && tar -xzf dart-sass.tgz -C /opt/dart-sass --strip-components=1
          chmod -R 755 /opt/dart-sass
          echo "/opt/dart-sass" >> $GITHUB_PATH

      - name: Build site
        run: hugo --environment production --minify

      - name: Create release zip
        run: zip -r site.zip public/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: site.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
