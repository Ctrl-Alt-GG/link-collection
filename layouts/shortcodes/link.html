<a
  class="link link-{{ .Get 0 }} mb-3 min-w-full rounded py-2 text-center text-lg sm:px-24"
  href="#"
  role="button"
  aria-label="Copy {{ .Get 0 }} to clipboard"
  onclick="event.preventDefault(); navigator.clipboard.writeText({{ .Get 0 }})"
  onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigator.clipboard.writeText({{ .Get 0 }})}"
>
  <span class="mr-1">{{ partial "icon.html" (.Get 0) }}</span>
  {{ .Get 0 }}
</a>
