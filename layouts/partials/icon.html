{{- /*
  icon.html — Render an inline SVG icon from assets/icons/<name>.svg.

  Usage:
    {{ partial "icon.html" (dict "name" "github" "class" "w-4 h-4") }}

  Params (dict keys):
    name   (required) — file stem under assets/icons/, e.g. "github".
    class  (optional) — space-separated CSS classes applied to <svg>.
    id     (optional) — id attribute applied to <svg>.
    label  (optional) — accessible name; when set, renders role="img"
                        aria-label; otherwise the icon is aria-hidden.
    size   (optional) — width/height in pixels (applied as attributes).
*/ -}}

{{- $name := .name -}}
{{- $class := .class | default "" -}}
{{- $id := .id -}}
{{- $label := .label -}}
{{- $size := .size -}}

{{- with resources.Get (printf "icons/%s.svg" $name) -}}
  {{- $svg := .Content -}}
  {{- $attrs := slice -}}
  {{- with $id }}{{ $attrs = $attrs | append (printf `id="%s"` .) }}{{ end -}}
  {{- with $class }}{{ $attrs = $attrs | append (printf `class="%s"` .) }}{{ end -}}
  {{- with $size }}{{ $attrs = $attrs | append (printf `width="%v" height="%v"` . .) }}{{ end -}}
  {{- if $label -}}
    {{- $attrs = $attrs | append (printf `role="img" aria-label="%s"` $label) -}}
  {{- else -}}
    {{- $attrs = $attrs | append `aria-hidden="true" focusable="false"` -}}
  {{- end -}}
  {{- /* Match optional XML prolog/comments, then the first <svg> opening tag and the rest.
         Anchored at ^ so only the outermost <svg> is rewritten; nested SVGs are left intact.
         Capture groups:
           1 = leading whitespace/XML prolog/comments before the outer <svg>
           2 = existing attributes on the outer <svg> opening tag
           3 = remaining SVG content after the opening tag (inner markup + closing tag) */ -}}
  {{- $fullRE := `(?s)^((?:\s|<\?xml[^>]*\?>|<!--.*?-->)*?)<svg\b([^>]*)>(.*)$` -}}
  {{- /* Extract the existing <svg> attributes by replacing the entire string with group 2 */ -}}
  {{- $existingAttrs := replaceRE $fullRE `$2` $svg | strings.TrimSpace -}}
  {{- /* Strip attributes we inject ourselves to prevent duplicates.
         Injected attrs (id, class, width/height, role/aria) always take
         precedence over whatever the source SVG contained. */ -}}
  {{- $existingAttrs = replaceRE `(?:^|\s)(?:id|class|width|height|role|aria-label|aria-hidden|focusable)(?:\s*=\s*(?:"[^"]*"|'[^']*'|[^\s"'=<>\x60]+))?(?=\s|$)` "" $existingAttrs -}}
  {{- $existingAttrs = strings.TrimSpace (replaceRE `\s+` " " $existingAttrs) -}}
  {{- $injectedAttrs := delimit $attrs " " -}}
  {{- $newOpen := $injectedAttrs -}}
  {{- if $existingAttrs }}{{- $newOpen = printf "%s %s" $injectedAttrs $existingAttrs -}}{{- end -}}
  {{- $svg | replaceRE $fullRE (printf `${1}<svg %s>${3}` $newOpen) | safeHTML -}}
{{- end -}}
