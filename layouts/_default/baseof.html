<!doctype html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
  {{- partial "head.html" . -}}
  <body class="font-sans antialiased bg-surface text-on-surface min-h-screen flex flex-col">
    {{- /* Ctrl-Alt-GG family hairline — the shared brand signature across all three CAG sites. */ -}}
    <div class="h-1 bg-brand-600" aria-hidden="true"></div>
    {{- partial "header.html" . -}}
    <main class="flex-grow">{{- block "main" . }}{{- end }}</main>
    {{- partial "footer.html" . -}}
  </body>
</html>
